# kind: KafkaTopic
# metadata: { name: securebank.transactions, namespace: securebank, labels: { strimzi.io/cluster: securebank } }
# spec: { partitions: 3, replicas: 3 }
# (repeat for securebank.fraud-alerts and securebank.notifications)
