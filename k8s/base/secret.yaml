# =============================================================================
# TEMPLATE Secret — DO NOT ship real values in git.
#
# These are plaintext `stringData` placeholders so `kubectl apply -k` works out of
# the box for a demo cluster. In ANY shared/real environment, replace this file with:
#   * Sealed Secrets (bitnami-labs/sealed-secrets): commit a SealedSecret CR that the
#     controller decrypts in-cluster; OR
#   * External Secrets Operator / HashiCorp Vault: sync from a real secret store.
# The overlays (overlays/prod) should patch or REPLACE this with a SealedSecret.
#
# Rotate SECUREBANK_JWT_SECRET and the DB passwords before any non-local use.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: securebank-secret
  namespace: securebank
type: Opaque
stringData:
  # Per-service DB credentials.
  AUTH_DB_USER: "auth"
  AUTH_DB_PASSWORD: "auth"
  SECUREBANK_DB_USER: "securebank"
  SECUREBANK_DB_PASSWORD: "securebank"
  # Postgres superuser (used by the StatefulSet + init job).
  POSTGRES_SUPERUSER: "postgres"
  POSTGRES_SUPERPASSWORD: "postgres"
  # JWT signing key (>= 32 bytes). REPLACE THIS.
  SECUREBANK_JWT_SECRET: "change-me-to-a-long-random-secret-at-least-32-bytes-0123456789"
  # RabbitMQ.
  RABBITMQ_USER: "guest"
  RABBITMQ_PASSWORD: "guest"
  # Fraud AI key (blank => deterministic provider).
  SECUREBANK_AI_API_KEY: ""
