# =============================================================================
# Prometheus scrape config for the SecureBank mesh.
# Each Spring Boot service exposes Micrometer metrics at /actuator/prometheus
# (see each service's `management.endpoints.web.exposure.include: ...prometheus`).
# Targets use the docker-network service names + their HTTP ports.
# =============================================================================
global:
  scrape_interval: 15s
  scrape_timeout: 10s
  external_labels:
    platform: securebank

scrape_configs:
  - job_name: gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["gateway:8080"]
        labels: { service: gateway }

  - job_name: auth-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["auth-service:8081"]
        labels: { service: auth-service }

  - job_name: account-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["account-service:8082"]
        labels: { service: account-service }

  - job_name: transaction-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["transaction-service:8083"]
        labels: { service: transaction-service }

  - job_name: fraud-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["fraud-service:8084"]
        labels: { service: fraud-service }

  - job_name: notification-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["notification-service:8085"]
        labels: { service: notification-service }

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
